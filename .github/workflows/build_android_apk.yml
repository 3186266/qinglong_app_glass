name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 iOS workflow / 本地保持一致（Flutter 3.44.4 / Dart 3.12.2）
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: |
          # app/build.gradle.kts 写死了 compileSdk 35 与 ndkVersion 27.0.12077973，
          # runner 镜像不一定预装，缺了 AGP 会直接报错退出，这里先补齐
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name sdkmanager -type f | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" || true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (arm64)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-shrink \
            --no-tree-shake-icons

      - name: Show APK info
        run: |
          ls -lh build/app/outputs/flutter-apk/
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -r | head -n 1)
          "$AAPT" dump badging "$APK" | head -n 5 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinglong_app_android_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
